; carBuddy-4 - firmware para el CYD de 4" (ESP32-32E, pantalla ST7796 de 480x320)
; Familia E32R40T de LCDWiki: https://www.lcdwiki.com/4.0inch_ESP32-32E_Display

[platformio]
default_envs = cyd4

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Velocidad conservadora: algunas placas con USB-C fallan a velocidades altas
upload_speed = 115200
monitor_filters = esp32_exception_decoder
; 3 MB para el programa (sin OTA)
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    ; solo por sus fuentes, que incluyen acentos y la ñ (LovyanGFX las dibuja)
    olikraus/U8g2@^2.35

[env:cyd4]
; Ajustes de la pantalla y valores por defecto. Para cambiarlos, edita estas lineas
; (o añade un entorno nuevo) y, si no se aplica, haz Clean antes de compilar.
;   PANEL_INVERT_DEFAULT  true si los colores salen invertidos (fondo claro)
;   PANEL_RGB_ORDER       true si el rojo y el azul salen cambiados
;   SCREEN_ROTATION       1 = horizontal; 3 = horizontal girada 180 grados
;   DEFAULT_DEVICE_NAME   nombre inicial en la red (nombre.local); luego se cambia en la web
;   DEFAULT_TIMEZONE_ID   huso horario inicial (un identificador de src/services/TimeZones.cpp)
build_flags =
    -DPANEL_INVERT_DEFAULT=false
    -DPANEL_RGB_ORDER=false
    -DSCREEN_ROTATION=1
    -DDEFAULT_DEVICE_NAME=\"carbuddy4\"
    -DDEFAULT_TIMEZONE_ID=\"Europe/Madrid\"
